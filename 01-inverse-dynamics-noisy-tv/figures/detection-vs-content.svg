  <text x="642.1600000000001" y="75" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.96</text>
  <text x="232" y="123" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="400" font-style="normal">Detect the TV reshuffling</text>
  <path d="M250 121 h393.64 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-393.64 z" fill="#eb6834"/>
  <text x="654.64" y="133" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.99</text>
  <text x="232" y="181" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="400" font-style="normal">Read the TV bits, neural</text>
  <path d="M250 160 h212.07999999999998 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-212.07999999999998 z" fill="#2a78d6"/>
  <text x="473.08" y="172" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.54</text>
  <path d="M250 179 h216.56000000000003 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-216.56000000000003 z" fill="#eb6834"/>
  <text x="477.56000000000006" y="191" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.55</text>
  <text x="232" y="239" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="400" font-style="normal">Read the TV bits, linear</text>
  <path d="M250 218 h197.8 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-197.8 z" fill="#2a78d6"/>
  <text x="458.8" y="230" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.50</text>

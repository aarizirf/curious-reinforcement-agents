  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <line x1="450.0" y1="36" x2="450.0" y2="258" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="450.0" y="28" font-size="12" fill="#767676" text-anchor="middle" font-weight="400" font-style="normal">chance</text>
  <line x1="650" y1="36" x2="650" y2="258" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="650" y="28" font-size="12" fill="#767676" text-anchor="middle" font-weight="400" font-style="normal">ceiling</text>
  <text x="232" y="65" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="400" font-style="normal">Tell press from wall-move</text>
  <path d="M250 44 h199.8 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-199.8 z" fill="#2a78d6"/>
  <text x="460.8" y="56" font-size="12" fill="#767676" text-anchor="start" font-weight="400" font-style="normal">0.51</text>
